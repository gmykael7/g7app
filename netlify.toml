[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.20.2"
  NPM_VERSION = "10.8.2"
  NPM_FLAGS = "--legacy-peer-deps --no-audit --no-fund"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
